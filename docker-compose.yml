version: '3.8'

services:
  # Redis for sessions and caching
  redis:
    image: redis:7-alpine
    container_name: studysync-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - studysync-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Paper Mind's Python retrieval service
  pdf-rag:
    build:
      context: ./pdf-rag-python/pdf-rag-python
      dockerfile: Dockerfile
    container_name: studysync-pdf-rag
    environment:
      PORT: 8000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    networks:
      - studysync-network
    restart: unless-stopped

  # Backend Instance 1
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studysync-backend-1
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL}
      REDIS_URL: redis://redis:6379
      REDIS_SESSION_TTL: 604800
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      FRONTEND_URL: ${FRONTEND_URL:-https://studysync.com}
      PYTHON_RAG_URL: http://pdf-rag:8000
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "5001:5000"
    depends_on:
      redis:
        condition: service_healthy
      pdf-rag:
        condition: service_started
    networks:
      - studysync-network
    restart: unless-stopped

  # Backend Instance 2
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studysync-backend-2
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL}
      REDIS_URL: redis://redis:6379
      REDIS_SESSION_TTL: 604800
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      FRONTEND_URL: ${FRONTEND_URL:-https://studysync.com}
      PYTHON_RAG_URL: http://pdf-rag:8000
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "5002:5000"
    depends_on:
      redis:
        condition: service_healthy
      pdf-rag:
        condition: service_started
    networks:
      - studysync-network
    restart: unless-stopped

  # Backend Instance 3
  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studysync-backend-3
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL}
      REDIS_URL: redis://redis:6379
      REDIS_SESSION_TTL: 604800
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      FRONTEND_URL: ${FRONTEND_URL:-https://studysync.com}
      PYTHON_RAG_URL: http://pdf-rag:8000
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "5003:5000"
    depends_on:
      redis:
        condition: service_healthy
      pdf-rag:
        condition: service_started
    networks:
      - studysync-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studysync-frontend
    ports:
      - "8080:80"
    networks:
      - studysync-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: studysync-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - frontend
    networks:
      - studysync-network
    restart: unless-stopped

volumes:
  redis-data:
  backend-uploads:

networks:
  studysync-network:
    driver: bridge
